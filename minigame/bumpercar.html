<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bumper Car Smash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050510;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace; /* Arcade font style */
            touch-action: none; /* Prevent scroll on drag */
            user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .neon-text {
            color: #fff;
            text-shadow:
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #0ff,
                0 0 40px #0ff,
                0 0 80px #0ff;
        }
        .neon-text-red {
            color: #fff;
            text-shadow:
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #f05,
                0 0 40px #f05,
                0 0 80px #f05;
        }
        .neon-box {
            border: 2px solid #0ff;
            box-shadow: 0 0 10px #0ff, inset 0 0 10px #0ff;
            background: rgba(0, 20, 30, 0.8);
            backdrop-filter: blur(4px);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- HUD -->
    <div id="hud" class="absolute top-4 left-0 right-0 flex justify-center pointer-events-none z-10 hidden">
        <div class="text-3xl font-bold neon-text">SCORE: <span id="scoreVal">0</span></div>
    </div>
    <!-- Start Screen -->
    <div id="startScreen" class="absolute inset-0 flex flex-col items-center justify-center z-20 bg-black/60 backdrop-blur-sm transition-opacity duration-300">
        <h1 class="text-5xl sm:text-7xl font-black mb-8 neon-text tracking-widest text-center">BUMPER<br>SMASH</h1>
        <div class="neon-box p-6 rounded-xl text-center max-w-sm mx-4">
            <p class="text-cyan-200 mb-4 text-lg">Drag & Release to launch.</p>
            <p class="text-cyan-200 mb-6 text-lg">Smash red enemies off the glowing arena.</p>
            <button id="btnStart" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xl rounded shadow-[0_0_15px_#0ff] transition-all transform hover:scale-105">START GAME</button>
        </div>
    </div>
    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="absolute inset-0 flex flex-col items-center justify-center z-20 bg-black/80 backdrop-blur-md hidden transition-opacity duration-300">
        <h1 class="text-6xl sm:text-7xl font-black mb-4 neon-text-red tracking-widest">GAME OVER</h1>
        <div class="text-2xl text-white mb-8">FINAL SCORE: <span id="finalScore" class="font-bold neon-text">0</span></div>
        <button id="btnRestart" class="px-8 py-3 bg-red-600 hover:bg-red-500 text-white font-bold text-xl rounded shadow-[0_0_15px_#f05] transition-all transform hover:scale-105">PLAY AGAIN</button>
    </div>
    <canvas id="gameCanvas"></canvas>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const hud = document.getElementById('hud');
    const scoreVal = document.getElementById('scoreVal');
    const finalScore = document.getElementById('finalScore');
    const btnStart = document.getElementById('btnStart');
    const btnRestart = document.getElementById('btnRestart');
    // Game Config & State
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    
    // Arena
    let arena = { x: 0, y: 0, w: 800, h: 600 };
    
    // Camera / Shake
    let shakeTime = 0;
    let shakeMag = 0;
    // Entities
    let player = null;
    let enemies = [];
    let particles = [];
    
    // Input
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };
    // Resize canvas
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Center arena
        arena.w = Math.min(window.innerWidth * 0.9, 1000);
        arena.h = Math.min(window.innerHeight * 0.8, 800);
        arena.x = (canvas.width - arena.w) / 2;
        arena.y = (canvas.height - arena.h) / 2;
    }
    window.addEventListener('resize', resize);
    resize();
    // Classes
    class Car {
        constructor(x, y, radius, color, isPlayer = false) {
            this.x = x;
            this.y = y;
            this.vx = 0;
            this.vy = 0;
            this.radius = radius;
            this.mass = radius;
            this.color = color;
            this.isPlayer = isPlayer;
            this.friction = 0.97;
            this.dashCooldown = Math.random() * 100 + 50; // For enemies
            this.isFalling = false;
            this.scale = 1;
        }
        update() {
            if (this.isFalling) {
                this.scale -= 0.05;
                if (this.scale <= 0) this.scale = 0;
                return;
            }
            this.x += this.vx;
            this.y += this.vy;
            this.vx *= this.friction;
            this.vy *= this.friction;
            // Enemy AI Dash
            if (!this.isPlayer && gameState === 'PLAYING') {
                this.dashCooldown--;
                if (this.dashCooldown <= 0) {
                    const speed = Math.hypot(this.vx, this.vy);
                    if (speed < 2 && player && !player.isFalling) {
                        // Dash towards player
                        const dx = player.x - this.x;
                        const dy = player.y - this.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist > 0) {
                            const force = 15;
                            this.vx += (dx / dist) * force;
                            this.vy += (dy / dist) * force;
                            spawnParticles(this.x, this.y, 5, this.color);
                        }
                    }
                    this.dashCooldown = Math.random() * 120 + 60;
                }
            }
        }
        draw(ctx) {
            if (this.scale <= 0) return;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(this.scale, this.scale);
            // Glow
            ctx.shadowBlur = 20;
            ctx.shadowColor = this.color;
            
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#111';
            ctx.fill();
            
            ctx.lineWidth = 4;
            ctx.strokeStyle = this.color;
            ctx.stroke();
            // Inner design
            ctx.beginPath();
            ctx.arc(0, 0, this.radius * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.restore();
        }
    }
    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.life = 1.0;
            this.decay = Math.random() * 0.05 + 0.02;
            this.color = color;
            this.size = Math.random() * 4 + 2;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay;
        }
        draw(ctx) {
            if (this.life <= 0) return;
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
        }
    }
    // Utility & Effects
    function spawnParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color));
        }
    }
    function triggerShake(force) {
        shakeMag = Math.min(force * 2, 20); // max shake
        shakeTime = 15;
    }
    function checkArenaBounds(car) {
        if (car.isFalling) return;
        // Check if center is outside arena
        if (car.x < arena.x || car.x > arena.x + arena.w || car.y < arena.y || car.y > arena.y + arena.h) {
            car.isFalling = true;
            spawnParticles(car.x, car.y, 20, car.color);
            
            if (car.isPlayer) {
                setTimeout(endGame, 1000);
            } else {
                score++;
                scoreVal.innerText = score;
            }
        }
    }
    function resolveCollision(c1, c2) {
        if (c1.isFalling || c2.isFalling) return;
        const dx = c2.x - c1.x;
        const dy = c2.y - c1.y;
        const dist = Math.hypot(dx, dy);
        
        if (dist === 0 || dist >= c1.radius + c2.radius) return;
        // Separation (prevent overlap)
        const overlap = (c1.radius + c2.radius) - dist;
        const nx = dx / dist;
        const ny = dy / dist;
        
        c1.x -= nx * (overlap / 2);
        c1.y -= ny * (overlap / 2);
        c2.x += nx * (overlap / 2);
        c2.y += ny * (overlap / 2);
        // Velocity math (Elastic Collision)
        const rvx = c2.vx - c1.vx;
        const rvy = c2.vy - c1.vy;
        const velAlongNormal = rvx * nx + rvy * ny;
        
        // Do not resolve if velocities are separating
        if (velAlongNormal > 0) return;
        const e = 1.2; // Restitution (bounciness > 1 means they gain energy, arcade feel)
        let j = -(1 + e) * velAlongNormal;
        j /= (1 / c1.mass + 1 / c2.mass);
        const impulseX = j * nx;
        const impulseY = j * ny;
        c1.vx -= impulseX / c1.mass;
        c1.vy -= impulseY / c1.mass;
        c2.vx += impulseX / c2.mass;
        c2.vy += impulseY / c2.mass;
        // Juice: Shake and particles on heavy hit
        if (Math.abs(j) > 200) { // arbitrary threshold based on mass/speed
            triggerShake(Math.abs(j) / 50);
            spawnParticles(c1.x + nx * c1.radius, c1.y + ny * c1.radius, 15, '#fff');
        }
    }
    // Spawner
    let spawnTimer = 0;
    function spawnEnemy() {
        // Spawn near edges but inside
        const edge = Math.floor(Math.random() * 4);
        let x, y;
        const pad = 40;
        if (edge === 0) { x = arena.x + Math.random()*arena.w; y = arena.y + pad; } // Top
        else if (edge === 1) { x = arena.x + arena.w - pad; y = arena.y + Math.random()*arena.h; } // Right
        else if (edge === 2) { x = arena.x + Math.random()*arena.w; y = arena.y + arena.h - pad; } // Bottom
        else { x = arena.x + pad; y = arena.y + Math.random()*arena.h; } // Left
        enemies.push(new Car(x, y, 20, '#ff0055', false));
    }
    // Input Handling
    function getPointerPos(e) {
        let clientX = e.clientX;
        let clientY = e.clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }
        return { x: clientX, y: clientY };
    }
    function handleDown(e) {
        if (gameState !== 'PLAYING' || !player || player.isFalling) return;
        const pos = getPointerPos(e);
        
        const dist = Math.hypot(pos.x - player.x, pos.y - player.y);
        // Generous hitbox for touch
        if (dist < player.radius * 3) {
            isDragging = true;
            dragStart = { ...pos };
            dragCurrent = { ...pos };
        }
    }
    function handleMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        dragCurrent = getPointerPos(e);
    }
    function handleUp(e) {
        if (!isDragging) return;
        isDragging = false;
        
        // Launch logic
        const dx = dragStart.x - dragCurrent.x;
        const dy = dragStart.y - dragCurrent.y;
        
        const power = 0.15; // Launch multiplier
        const maxSpeed = 30;
        
        let vx = dx * power;
        let vy = dy * power;
        
        const speed = Math.hypot(vx, vy);
        if (speed > maxSpeed) {
            vx = (vx / speed) * maxSpeed;
            vy = (vy / speed) * maxSpeed;
        }
        
        player.vx += vx;
        player.vy += vy;
    }
    canvas.addEventListener('mousedown', handleDown);
    canvas.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleUp);
    
    canvas.addEventListener('touchstart', handleDown, {passive: false});
    canvas.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('touchend', handleUp);
    // Game Flow
    function startGame() {
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        
        score = 0;
        scoreVal.innerText = score;
        gameState = 'PLAYING';
        
        player = new Car(arena.x + arena.w/2, arena.y + arena.h/2, 25, '#00ffff', true);
        enemies = [];
        particles = [];
        spawnTimer = 60;
    }
    function endGame() {
        gameState = 'GAMEOVER';
        hud.classList.add('hidden');
        finalScore.innerText = score;
        gameOverScreen.classList.remove('hidden');
    }
    btnStart.addEventListener('click', startGame);
    btnRestart.addEventListener('click', startGame);
    // Render Loop
    function drawGrid(ctx) {
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
        ctx.lineWidth = 1;
        const gridSize = 50;
        
        ctx.beginPath();
        for(let x = arena.x; x <= arena.x + arena.w; x += gridSize) {
            ctx.moveTo(x, arena.y);
            ctx.lineTo(x, arena.y + arena.h);
        }
        for(let y = arena.y; y <= arena.y + arena.h; y += gridSize) {
            ctx.moveTo(arena.x, y);
            ctx.lineTo(arena.x + arena.w, y);
        }
        ctx.stroke();
    }
    function update() {
        if (gameState !== 'PLAYING') return;
        // Spawning
        spawnTimer--;
        if (spawnTimer <= 0) {
            spawnEnemy();
            // Spawn gets faster as score goes up
            spawnTimer = Math.max(60, 150 - (score * 5)); 
        }
        // Update entities
        if (player) player.update();
        enemies.forEach(e => e.update());
        
        // Remove dead enemies
        enemies = enemies.filter(e => e.scale > 0);
        
        // Particles
        particles.forEach(p => p.update());
        particles = particles.filter(p => p.life > 0);
        // Collisions
        if (player) {
            enemies.forEach(e => resolveCollision(player, e));
        }
        for (let i = 0; i < enemies.length; i++) {
            for (let j = i + 1; j < enemies.length; j++) {
                resolveCollision(enemies[i], enemies[j]);
            }
        }
        // Bounds check
        if (player) checkArenaBounds(player);
        enemies.forEach(e => checkArenaBounds(e));
        // Screen Shake decay
        if (shakeTime > 0) {
            shakeTime--;
            shakeMag *= 0.9;
        }
    }
    function draw() {
        // Clear background (Abyss)
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        
        // Apply Camera Shake
        if (shakeTime > 0 && gameState === 'PLAYING') {
            const dx = (Math.random() - 0.5) * shakeMag;
            const dy = (Math.random() - 0.5) * shakeMag;
            ctx.translate(dx, dy);
        }
        // Draw Arena
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#0ff';
        ctx.fillStyle = '#00111a';
        ctx.fillRect(arena.x, arena.y, arena.w, arena.h);
        
        ctx.strokeStyle = '#0ff';
        ctx.lineWidth = 4;
        ctx.strokeRect(arena.x, arena.y, arena.w, arena.h);
        ctx.shadowBlur = 0; // reset
        drawGrid(ctx);
        // Draw Slingshot Trajectory
        if (isDragging && player && !player.isFalling) {
            const dx = dragStart.x - dragCurrent.x;
            const dy = dragStart.y - dragCurrent.y;
            const dist = Math.hypot(dx, dy);
            
            if (dist > 10) {
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                // The line extends in the opposite direction of the drag
                ctx.lineTo(player.x + dx, player.y + dy);
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.lineWidth = 3;
                ctx.setLineDash([10, 10]);
                ctx.stroke();
                ctx.setLineDash([]);
                
                // Draw a small target circle at the end
                ctx.beginPath();
                ctx.arc(player.x + dx, player.y + dy, 5, 0, Math.PI*2);
                ctx.fillStyle = '#0ff';
                ctx.fill();
            }
        }
        // Draw Particles
        particles.forEach(p => p.draw(ctx));
        // Draw Entities
        enemies.forEach(e => e.draw(ctx));
        if (player) player.draw(ctx);
        ctx.restore();
    }
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }
    // Start loop
    loop();
</script>
</body>
</html>
