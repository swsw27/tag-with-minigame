<!DOCTYPE html>
<html lang="ko">
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
      body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a2e; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script>
      let choices = ['✌️', '✊', '🖐️'];
      let gameMode = "MENU";
      
      let playerChoice = "", comChoice = "", result = "준비됐나요?";
      let pWin = 0, cWin = 0, battleOver = false, isRolling = false;
      let buttons = [], menuButtons = [], subSelectButtons = [];
      let version = "v1.13.2"; // 💡 단축키 정밀 연동 버전!

      let currentDifficulty = "NORMAL"; 
      let diffButtons = [];

      let cheatText = "";
      let cheatTimer = 0;
      let playerXP = 0; 

      // 묵찌빠 전용 엔진 전역 변수
      let attacker = "", mzpStep = "RSP";
      let currentAttackerHandName = ""; 
      let isMzpRolling = false; 
      let pNextTemp = "", cNextTemp = ""; 
      let chantText = "", chantTimer = 0;
      
      let waitTimer = 0, shakeAmount = 0, particles = [];
      let isSettingOpen = false, settingClicked = false; 
      let masterVolume = 0.5; 
      let volOptions = [0, 0.25, 0.5, 0.75, 1.0];
      let volLabels = ["무음", "25%", "50%", "75%", "100%"];
      let audioCtx;
      let closeBtn = { x: 0, y: 0, w: 40, h: 40 };

      let canClick = true, lastClickTime = 0; 

      // 보리보리쌀 전용 변수
      let boriRole = "ATTACK", boriState = "READY", computerSaying = "대기...";
      let computerActionTime = 0, boriTargetTime = 0, boriSuccess = false, defenseTriggered = false, boriButtons = [];

      function playBeep(freq, type, duration) {
        if (masterVolume === 0) return;
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1 * masterVolume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      }

      function setup() { createCanvas(windowWidth, windowHeight); setupButtons(); }

      function setupButtons() {
        buttons = []; menuButtons = []; subSelectButtons = []; diffButtons = [];
        let spacing = 140;
        for (let i = 0; i < 3; i++) {
          buttons.push({ x: width / 2 + (i - 1) * spacing, y: height - 100, w: 110, h: 70, emoji: choices[i], label: ["찌", "묵", "빠"][i] });
        }
        menuButtons.push({ x: width / 2 - 160, y: height / 2 + 100, w: 150, h: 60, label: "🎲 랜덤", mode: "RANDOM_SELECT" });
        menuButtons.push({ x: width / 2, y: height / 2 + 100, w: 150, h: 60, label: "⚡ 실력", mode: "SKILL_SELECT" });
        menuButtons.push({ x: width / 2 + 160, y: height / 2 + 100, w: 150, h: 60, label: "🔥 묵찌빠", mode: "MZP_BATTLE" });
        menuButtons.push({ x: width / 2, y: height / 2 + 180, w: 200, h: 60, label: "🌾 보리보리쌀", mode: "BORI_BATTLE" });

        let diffs = [
          {l: "🐣 쉬움", d: "EASY"}, {l: "⚙️ 보통", d: "NORMAL"}, 
          {l: "🌶️ 매운맛", d: "HARD"}, {l: "🔥 초매운맛", d: "VERY_HARD"}, 
          {l: "👁️ 궁예", d: "GUNGYE"}
        ];
        let dSpacing = 105;
        diffs.forEach((df, idx) => { diffButtons.push({ x: width / 2 + (idx - 2) * dSpacing, y: 85, w: 95, h: 35, label: df.l, diff: df.d }); });
        closeBtn.x = width / 2 + 270; closeBtn.y = height / 2 - 65;
      }

      function setupSubButtons(type) {
        subSelectButtons = [];
        subSelectButtons.push({ x: width / 2 - 110, y: height / 2 + 150, w: 180, h: 70, label: "🐣 연습하기", mode: type + "_PRACTICE" });
        subSelectButtons.push({ x: width / 2 + 110, y: height / 2 + 150, w: 180, h: 70, label: "🏆 15판 8선승", mode: type + "_BATTLE" });
      }

      function clearGameData() {
        playerChoice = ""; comChoice = ""; result = "준비!";
        pWin = 0; cWin = 0; battleOver = false; isRolling = false; isMzpRolling = false;
        attacker = ""; mzpStep = "RSP"; currentAttackerHandName = "";
        chantText = ""; chantTimer = 0; waitTimer = 0; particles = [];
        cheatTimer = 0; cheatText = "";
        boriRole = "ATTACK"; boriState = "READY"; computerSaying = "대기...";
        computerActionTime = 0; boriTargetTime = 0; boriSuccess = false; defenseTriggered = false;
      }

      function changeMode(newMode) { 
        gameMode = newMode; 
        clearGameData(); 
        if (gameMode === "RANDOM_SELECT") setupSubButtons("RANDOM"); 
        if (gameMode === "SKILL_SELECT") setupSubButtons("SKILL"); 
        if (gameMode === "BORI_BATTLE") initBoriRound("ATTACK"); 
        playBeep(523, 'sine', 0.1); 
      }

      function getHandName(emoji) {
        if (emoji === '✊') return "묵";
        if (emoji === '✌️') return "찌";
        if (emoji === '🖐️') return "빠";
        return "";
      }

      function draw() {
        background(26, 26, 46);
        if (shakeAmount > 0) { translate(random(-shakeAmount, shakeAmount), random(-shakeAmount, shakeAmount)); shakeAmount *= 0.9; }

        if (gameMode === "MENU") drawMenu();
        else if (gameMode === "RANDOM_SELECT") drawSubSelect("🎲 랜덤 모드");
        else if (gameMode === "SKILL_SELECT") drawSubSelect("⚡ 실력 모드");
        else if (gameMode === "BORI_BATTLE") drawBoriGame(); 
        else drawGame(); 

        drawSettingIcon();

        if (waitTimer > 0) {
          waitTimer--;
          if (waitTimer === 0 && !battleOver) { 
            if (gameMode === "MZP_BATTLE") {
              playerChoice = ""; comChoice = "";
              result = attacker === "PLAYER" ? "내 차례! 패를 고르세요." : "컴퓨터 공격 차례! 수비하세요.";
            } else {
              playerChoice = ""; comChoice = "❓"; result = "준비!"; 
            }
          }
        }

        if (gameMode === "MZP_BATTLE" && chantTimer > 0) {
          push(); textAlign(CENTER, CENTER); textSize(50 + chantTimer);
          fill(255, 255, 0, chantTimer * 5); textStyle(BOLD);
          text(chantText, width / 2, height / 2 - 160);
          chantTimer -= 3; pop();
        }

        if (cheatTimer > 0) {
          push(); textAlign(CENTER, CENTER); let bubbleX = width / 2 + 180; let bubbleY = height / 2 - 100;
          fill(255, 0, 0, min(cheatTimer * 10, 230)); rect(bubbleX, bubbleY, 140, 45, 10);
          fill(255, cheatTimer * 10); textSize(18); textStyle(BOLD); text(cheatText, bubbleX, bubbleY + 2); cheatTimer--; pop();
        }

        for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(); particles[i].show(); if (particles[i].finished()) particles.splice(i, 1); }
        if (isSettingOpen) drawSettingWindow();
      }

      function drawMenu() {
        push(); textAlign(CENTER, CENTER); fill(255); textSize(50); textStyle(BOLD); text("HAND MASTER", width / 2, height / 2 - 80); 
        textSize(22); fill(0, 255, 150); text(`내 누적 점수: 🌟 ${playerXP} XP`, width / 2, height / 2 - 20);
        menuButtons.forEach(btn => drawCustomBtn(btn, '#0f3460', '#e94560')); pop();
      }

      function drawSubSelect(titleText) {
        push(); textAlign(CENTER, CENTER); fill(255, 204, 0); textSize(45); textStyle(BOLD); text(titleText, width / 2, height / 2 - 50);
        subSelectButtons.forEach(btn => drawCustomBtn(btn, '#16213e', '#4834d4'));
        drawCustomBtn({x: 100, y: 50, w: 120, h: 50}, '#333', '#e94560', "MENU"); pop();
      }

      function drawGame() {
        push(); textAlign(CENTER, CENTER); fill(255); textSize(20);
        let title = gameMode === "MZP_BATTLE" ? "🔥 묵찌빠 배틀" : (gameMode.startsWith("SKILL") ? "⚡ 실력 모드" : "🎲 랜덤 모드");
        text(title, width / 2, 40);
        push(); textAlign(RIGHT, CENTER); fill(0, 255, 150); textStyle(BOLD); textSize(22); text(`🌟 ${playerXP} XP`, width - 90, 40); pop();
        
        let backDest = "MENU";
        if (gameMode.startsWith("RANDOM")) backDest = "RANDOM_SELECT";
        if (gameMode.startsWith("SKILL")) backDest = "SKILL_SELECT";
        drawCustomBtn({x: 100, y: 50, w: 120, h: 50}, '#333', '#e94560', "◀ 뒤로", backDest);

        diffButtons.forEach(btn => { let isSelected = (currentDifficulty === btn.diff); drawCustomBtn(btn, isSelected ? '#4ecc71' : '#1f4068', '#4ecc71'); });
        
        if (gameMode !== "MZP_BATTLE" && gameMode.endsWith("BATTLE") && !battleOver) {
          push(); rectMode(CENTER); fill(0, 100); rect(width/2, 85, 250, 35, 10);
          fill(255); textSize(16); text(`내 점수 [ ${pWin} : ${cWin} ] 컴퓨터`, width/2, 85); pop();
        }

        if (!battleOver) {
          textSize(32); fill(255, 204, 0); 
          if (gameMode === "MZP_BATTLE" && mzpStep === "MZP") {
            fill(attacker === "PLAYER" ? 0 : 255, attacker === "PLAYER" ? 255 : 0, 100);
            text(`[${attacker === "PLAYER" ? "내 공격 ⚡" : "수비 상태 🛡️"}] ${result}`, width / 2, 135);
          } else { text(result, width / 2, 135); }
        } else {
          fill(0, 255, 100); textSize(40); textStyle(BOLD);
          if (gameMode === "MZP_BATTLE") {
            text(result, width/2, 135);
          } else {
            let finalWinner = pWin >= 8 ? "🎉 15판 8선승 최종 우승! (+1 XP) 🎉" : "💀 컴퓨터가 최종 우승했습니다... 💀";
            text(finalWinner, width/2, 135);
          }
          drawCustomBtn({x: width/2, y: 200, w: 150, h: 50}, '#e94560', '#ff4d4d', "RESTART");
        }

        let displayP = playerChoice, displayC = comChoice;
        
        if (isMzpRolling) {
          displayP = choices[floor(frameCount * 0.4) % 3];
          displayC = choices[floor(frameCount * 0.4 + 1) % 3]; 
        } else if (isRolling) {
          displayC = choices[floor(frameCount * 0.2) % 3];
        } else {
          if (gameMode === "MZP_BATTLE") {
            if (mzpStep === "RSP" && !playerChoice) { displayP = "❓"; displayC = choices[floor(frameCount * 0.4) % 3]; } 
          } else {
            if (gameMode.startsWith("SKILL") && !playerChoice) {
              displayP = "❓"; let cycleTime = 600; let trickChance = 0;
              if (currentDifficulty === "NORMAL") cycleTime = 420;
              else if (currentDifficulty === "HARD") { cycleTime = 300; trickChance = 0.2; }       
              else if (currentDifficulty === "VERY_HARD" || currentDifficulty === "GUNGYE") { cycleTime = 140; trickChance = 0.45; } 
              let t = millis();
              if (trickChance > 0 && sin(t * 0.008) > (1 - trickChance * 2)) t += sin(t * 0.08) * 450; 
              displayC = choices[floor(t / (cycleTime / 3)) % 3];
            } else if (!playerChoice) { displayP = "❓"; displayC = "❓"; }
          }
        }

        textSize(120); text(displayP || "❓", width / 2 - 180, height / 2); text(displayC || "❓", width / 2 + 180, height / 2);
        textSize(40); fill(255, 30); text("VS", width / 2, height / 2);

        if (!battleOver && waitTimer <= 0 && !isRolling && !isMzpRolling) drawGameButtons(); 
        pop();
      }

      function handleChoiceInput(emojiHand) {
        if (battleOver || waitTimer > 0 || isRolling || isMzpRolling) return;
        if (gameMode.startsWith("SKILL")) {
          playerChoice = emojiHand; comChoice = choices[floor(frameCount * 0.4) % 3]; judgeNormal(); waitTimer = 180; 
        } else if (gameMode === "MZP_BATTLE") {
          if (mzpStep === "RSP") {
            playerChoice = emojiHand; comChoice = choices[floor(frameCount * 0.4) % 3]; judgeMzpDirect();
          } else { playMzp(emojiHand); }
        } else if (gameMode.startsWith("RANDOM")) {
          playerChoice = emojiHand; comChoice = random(choices); judgeNormal(); waitTimer = 120; 
        }
      }

      function mousePressed() {
        if (millis() - lastClickTime < 250) return; lastClickTime = millis(); if (!canClick) return; canClick = false; 
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (dist(mouseX, mouseY, width - 40, 40) < 25) { if (!settingClicked) { isSettingOpen = !isSettingOpen; settingClicked = true; } return; }
        if (isSettingOpen) { if (mouseInRect(closeBtn)) { isSettingOpen = false; } return; }

        if (gameMode === "MENU") { menuButtons.forEach(btn => { if (mouseInRect(btn)) changeMode(btn.mode); }); }
        else if (gameMode === "RANDOM_SELECT" || gameMode === "SKILL_SELECT") {
          if (mouseInRect({x: 100, y: 50, w: 120, h: 50})) { changeMode("MENU"); return; }
          subSelectButtons.forEach(btn => { if (mouseInRect(btn)) changeMode(btn.mode); });
        } else {
          if (mouseInRect({x: 100, y: 50, w: 120, h: 50})) { 
            let dest = "MENU";
            if (gameMode.startsWith("RANDOM")) dest = "RANDOM_SELECT";
            if (gameMode.startsWith("SKILL")) dest = "SKILL_SELECT";
            changeMode(dest); return; 
          }
          diffButtons.forEach(btn => { if (mouseInRect(btn)) { currentDifficulty = btn.diff; playBeep(330, 'sine', 0.05); if(gameMode==="BORI_BATTLE") initBoriRound(boriRole); } });

          if (gameMode === "BORI_BATTLE") {
            if (boriState === "RESULT" && mouseInRect({x: width/2, y: height/2 + 140, w: 220, h: 60})) { initBoriRound(boriRole === "ATTACK" ? "DEFEND" : "ATTACK"); }
            if (boriState === "PLAYING") boriButtons.forEach(btn => { if (mouseInRect(btn)) handleBoriAction(btn.action); }); return;
          }

          if (battleOver && mouseInRect({x: width/2, y: 200, w: 150, h: 50})) { clearGameData(); return; }
          if (waitTimer > 0 || isRolling || isMzpRolling) return;

          buttons.forEach(btn => { if (mouseInRect(btn)) handleChoiceInput(btn.emoji); });
        }
      }

      function judgeNormal() {
        if (playerChoice === comChoice) { result = "무승부!"; playBeep(330, 'square', 0.1); } 
        else if ((playerChoice === '✌️' && comChoice === '🖐️') || (playerChoice === '✊' && comChoice === '✌️') || (playerChoice === '🖐️' && comChoice === '✊')) { result = "🎉 승리! 🎉"; pWin++; createConfetti(); playBeep(659, 'sine', 0.15); } 
        else { result = "패배..."; cWin++; shakeAmount = 20; playBeep(110, 'sawtooth', 0.2); }
        if (gameMode.endsWith("BATTLE") && (pWin >= 8 || cWin >= 8)) { battleOver = true; if (pWin >= 8) playerXP += 1; }
      }

      function judgeMzpDirect() {
        chantText = "가위 바위 보!"; chantTimer = 60; playBeep(440, 'triangle', 0.1);
        
        if (currentDifficulty === "GUNGYE" && random(1) < 0.18) {
          cheatText = "[관심법...!]"; cheatTimer = 90;
          if (playerChoice === '✌️') comChoice = '✊';
          else if (playerChoice === '✊') comChoice = '🖐️';
          else if (playerChoice === '🖐️') comChoice = '✌️';
        }

        if (playerChoice === comChoice) { 
          result = "비겼다! 다시 가위바위보!"; playBeep(330, 'square', 0.1); 
          setTimeout(() => { playerChoice = ""; comChoice = ""; }, 1000);
        } else {
          if ((playerChoice === '✌️' && comChoice === '🖐️') || (playerChoice === '✊' && comChoice === '✌️') || (playerChoice === '🖐️' && comChoice === '✊')) {
            attacker = "PLAYER"; mzpStep = "MZP"; currentAttackerHandName = getHandName(playerChoice);
            result = "공격권을 얻었습니다!"; playBeep(523, 'sine', 0.1);
          } else { 
            attacker = "COM"; mzpStep = "MZP"; currentAttackerHandName = getHandName(comChoice);
            result = "컴퓨터가 공격합니다!"; playBeep(174, 'sawtooth', 0.2); 
          }
        }
      }

      function playMzp(p) {
        let pNext = p; let cNext = random(choices);
        
        if (currentDifficulty === "GUNGYE" && random(1) < 0.18) {
          cheatText = "[관심법...!]"; cheatTimer = 90;
          if (attacker === "PLAYER") {
            if (p === '✌️') cNext = '✊'; else if (p === '✊') cNext = '🖐️'; else if (p === '🖐️') cNext = '✌️';
          } else { cNext = p; }
        }

        let pName = getHandName(pNext); let cName = getHandName(cNext);

        if (attacker === "PLAYER") chantText = currentAttackerHandName + " " + currentAttackerHandName + " " + pName + "!";
        else chantText = currentAttackerHandName + " " + currentAttackerHandName + " " + cName + "!";
        
        chantTimer = 60; isMzpRolling = true; result = "얍!"; playBeep(440, 'triangle', 0.1);
        pNextTemp = pNext; cNextTemp = cNext;

        setTimeout(() => { 
          isMzpRolling = false; 
          playerChoice = pNextTemp; 
          comChoice = cNextTemp; 
          judgeMzp2(playerChoice, comChoice); 
        }, 600);
      }

      function judgeMzp2(p, c) {
        if (p === c) {
          battleOver = true;
          if (attacker === "PLAYER") { result = "🔥 나의 묵찌빠 최종 승리! (+2 XP) 🔥"; playerXP += 2; createConfetti(); playBeep(880, 'sine', 0.4); }
          else { result = "💀 컴퓨터의 묵찌빠 최종 승리... 💀"; shakeAmount = 25; playBeep(82, 'sawtooth', 0.5); }
        } else {
          let playerWonClash = ((p === '✌️' && c === '🖐️') || (p === '✊' && c === '✌️') || (p === '🖐️' && c === '✊'));
          if (playerWonClash) {
            if (attacker === "PLAYER") result = "공격권 유지!"; else { attacker = "PLAYER"; result = "공격권 탈취 성공!"; }
            currentAttackerHandName = getHandName(p);
          } else {
            if (attacker === "COM") result = "컴퓨터 공격권 유지!"; else { attacker = "COM"; result = "공격권 수비 실패!"; }
            currentAttackerHandName = getHandName(c);
          }
          waitTimer = 120;
        }
      }

      // 보리보리쌀 함수군
      function drawBoriGame() { push(); textAlign(CENTER, CENTER); fill(255); textSize(20); text("🌾 보리보리쌀 모드", width / 2, 40); push(); textAlign(RIGHT, CENTER); fill(0, 255, 150); textStyle(BOLD); textSize(22); text(`🌟 ${playerXP} XP`, width - 90, 40); pop(); drawCustomBtn({x: 100, y: 50, w: 120, h: 50}, '#333', '#e94560', "◀ 뒤로"); diffButtons.forEach(btn => { let isSelected = (currentDifficulty === btn.diff); drawCustomBtn(btn, isSelected ? '#4ecc71' : '#1f4068', '#4ecc71'); }); textSize(32); fill(255, 204, 0); text(`[${boriRole === "ATTACK" ? "내 공격 ✊" : "내 수비 🖐️"}] ${result}`, width / 2, 135); if (boriState === "PLAYING" && boriRole === "DEFEND") { let now = millis(); if (now > boriTargetTime && computerActionTime === 0) { computerSaying = "🔥 쌀!!! 🔥"; computerActionTime = now; playBeep(600, 'triangle', 0.1); } else if (computerActionTime === 0) { let speed = (currentDifficulty === "EASY" || currentDifficulty === "NORMAL") ? 700 : 400; if (floor(now / speed) % 2 === 0) computerSaying = "🌾 보리..."; else computerSaying = "🌾 보리... 보리..."; } let escapeLimit = (currentDifficulty === "EASY" || currentDifficulty === "NORMAL") ? 500 : 250; if (computerActionTime > 0 && now - computerActionTime > escapeLimit) { endBoriRound(false, "도망 성공! 컴퓨터가 빠져나갔습니다."); } } textSize(18); fill(200); text(boriRole === "ATTACK" ? "내 손(주먹)" : "컴퓨터(주먹)", width/2 - 120, height/2 - 80); text(boriRole === "ATTACK" ? "컴퓨터(보자기)" : "내 손(보자기)", width/2 + 120, height/2 - 80); textSize(100); let pHand = "✊", cHand = "🖐️"; if (boriRole === "ATTACK") { if (boriState === "RESULT") { pHand = boriSuccess ? "🏃" : "✊"; cHand = boriSuccess ? "🖐️" : "✊"; } } else { pHand = boriState === "RESULT" && boriSuccess ? "✊" : "🏃"; cHand = defenseTriggered ? "✊" : "🖐️"; } text(boriRole === "ATTACK" ? pHand : cHand, width / 2 - 120, height / 2); text(boriRole === "ATTACK" ? cHand : pHand, width / 2 + 120, height / 2); fill(255, 255, 150); textSize(24); text(computerSaying, width/2, height/2 + 80); if (boriState === "PLAYING") { boriButtons.forEach(btn => drawCustomBtn(btn, '#16213e', '#4834d4')); } else if (boriState === "RESULT") { drawCustomBtn({x: width/2, y: height/2 + 140, w: 220, h: 60}, '#e94560', '#ff4d4d', "👉 공수 교대 [Space]"); } pop(); }
      function initBoriRound(role) { boriRole = role; boriState = "PLAYING"; if(role === "ATTACK") result = "공격: 낚시[A] 후 타이밍 맞춰 '쌀!!'[D]"; else result = "수비: 컴퓨터가 '쌀'할 때 움켜쥐기[D]"; defenseTriggered = false; boriButtons = []; if (role === "ATTACK") { boriButtons.push({ x: width/2 - 80, y: height - 100, w: 130, h: 60, label: "🌾 보리 [A]", action: "FAKE" }); boriButtons.push({ x: width/2 + 80, y: height - 100, w: 130, h: 60, label: "🔥 쌀!! [D]", action: "STRIKE" }); computerSaying = "수비 대기 중... 🖐️"; } else { boriButtons.push({ x: width/2, y: height - 100, w: 220, h: 70, label: "✊ 움켜쥐기! [D]", action: "CATCH" }); computerSaying = "보리..."; let minTime = (currentDifficulty === "EASY" || currentDifficulty === "NORMAL") ? 1800 : 1000; let maxTime = (currentDifficulty === "EASY" || currentDifficulty === "NORMAL") ? 3500 : 2000; boriTargetTime = millis() + random(minTime, maxTime); computerActionTime = 0; } }
      function handleBoriAction(action) { if (boriRole === "ATTACK") { if (action === "FAKE") { let trickChance = currentDifficulty === "EASY" ? 0.15 : 0.05; if (random(1) < trickChance) { computerSaying = "✊ 악!! (헛스윙)"; result = "컴퓨터 오발동!"; playBeep(200, 'sawtooth', 0.15); shakeAmount = 10; } else { computerSaying = "🌾 보리~"; result = "간보기 중"; playBeep(350, 'sine', 0.08); } } else if (action === "STRIKE") { computerSaying = "🔥 쌀!!"; if (random(1) < (currentDifficulty === "EASY" ? 0.75 : 0.5)) { endBoriRound(true, `성공! (+1 XP)`); playerXP += 1; } else { endBoriRound(false, "실패!"); } } } else if (boriRole === "DEFEND") { if (action === "CATCH") { defenseTriggered = true; if (computerActionTime > 0) { if (millis() - computerActionTime < (currentDifficulty === "EASY" ? 600 : 400)) { endBoriRound(true, `잡았다! (+1 XP)`); playerXP += 1; } else { endBoriRound(false, `놓침!`); } } else { endBoriRound(false, "파울!"); } } } }
      function endBoriRound(playerWin, msg) { boriState = "RESULT"; boriSuccess = playerWin; result = msg; if (playerWin) { createConfetti(); playBeep(659, 'sine', 0.3); } else { shakeAmount = 20; playBeep(180, 'sawtooth', 0.3); } }
      function drawSettingIcon() { push(); textAlign(CENTER, CENTER); textSize(30); fill(dist(mouseX, mouseY, width - 40, 40) < 20 ? 255 : 150); text("⚙️", width - 40, 40); pop(); }
      function drawSettingWindow() { push(); fill(0, 180); rect(0, 0, width, height); rectMode(CENTER); fill(135, 206, 235); rect(width/2, height/2, 600, 220, 10); fill(255); textAlign(CENTER); textSize(24); textStyle(BOLD); text("SOUND VOLUME", width/2, height/2 - 55); fill(mouseInRect(closeBtn) ? '#e94560' : 50); rect(closeBtn.x, closeBtn.y, closeBtn.w, closeBtn.h, 5); fill(255); textAlign(CENTER, CENTER); textSize(18); text("X", closeBtn.x, closeBtn.y + 2); let bw = 100, bh = 60, gap = 10; let startX = width/2 - (bw * 2.5 + gap * 2); for (let i = 0; i < 5; i++) { let bx = startX + i * (bw + gap) + bw/2; let by = height/2 + 25; let isSelected = (masterVolume === volOptions[i]); fill(isSelected ? 255 : 50); rect(bx, by, bw, bh, 5); fill(isSelected ? 50 : 255); textSize(18); text(volLabels[i], bx, by + 2); if (mouseIsPressed && mouseX > bx-bw/2 && mouseX < bx+bw/2 && mouseY > by-bh/2 && mouseY < by+bh/2) { if (masterVolume !== volOptions[i]) { masterVolume = volOptions[i]; playBeep(440, 'sine', 0.1); } } } pop(); }
      function mouseReleased() { canClick = true; settingClicked = false; }
      function drawCustomBtn(btn, col, hovCol, labelOverride, modeOverride) { push(); let isHover = mouseInRect(btn); rectMode(CENTER); stroke(isHover?hovCol:col); fill(isHover?hovCol:col); rect(btn.x, btn.y, btn.w, btn.h, 15); noStroke(); fill(255); textAlign(CENTER, CENTER); textSize(btn.h * 0.35); text(labelOverride || btn.label, btn.x, btn.y + 5); pop(); }
      function drawGameButtons() { buttons.forEach(btn => { let isHover = mouseInRect(btn); push(); rectMode(CENTER); textAlign(CENTER, CENTER); strokeWeight(3); stroke(isHover ? '#4ecc71' : 255); fill(isHover ? '#4ecc71' : 255); rect(btn.x, btn.y, btn.w, btn.h, 20); noStroke(); fill(isHover ? 255 : 0); textSize(28); text(btn.emoji, btn.x, btn.y - 14); textSize(16); textStyle(BOLD); text(btn.label, btn.x, btn.y + 18); pop(); }); }
      function createConfetti() { for (let i = 0; i < 30; i++) particles.push(new Particle(width / 2, height / 2)); }
      class Particle { constructor(x,y){this.pos=createVector(x,y);this.vel=p5.Vector.random2D().mult(random(2,6));this.acc=createVector(0,0.1);this.color=color(random(255),random(255),random(255));this.alpha=255;} update(){this.vel.add(this.acc);this.pos.add(this.vel);this.alpha-=5;} show(){noStroke();fill(this.color.levels[0],this.color.levels[1],this.color.levels[2],this.alpha);ellipse(this.pos.x,this.pos.y,8);} finished(){return this.alpha<0;} }
      function mouseInRect(btn) { return mouseX > btn.x - btn.w/2 && mouseX < btn.x + btn.w/2 && mouseY > btn.y - btn.h/2 && mouseY < btn.y + btn.h/2; }
      function windowResized() { resizeCanvas(windowWidth, windowHeight); setupButtons(); }
      
      function keyPressed() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        let lowerKey = key.toLowerCase();
        
        // 1. 보리보리쌀 단축키 처리
        if (gameMode === "BORI_BATTLE") {
          if (boriState === "RESULT" && (key === ' ' || keyCode === ENTER)) {
            initBoriRound(boriRole === "ATTACK" ? "DEFEND" : "ATTACK");
            playBeep(440, 'sine', 0.1);
            return;
          }
          if (boriState === "PLAYING") {
            if (boriRole === "ATTACK") {
              if (lowerKey === 'a') handleBoriAction("FAKE");    // a: 보리
              if (lowerKey === 'd') handleBoriAction("STRIKE");  // d: 쌀
            } else if (boriRole === "DEFEND") {
              if (lowerKey === 'd') handleBoriAction("CATCH");   // d: 움켜쥐기
            }
          }
          return;
        }

        // 2. 가위바위보 / 묵찌빠 단축키 처리
        if (gameMode === "MZP_BATTLE" || gameMode.startsWith("RANDOM") || gameMode.startsWith("SKILL")) {
          if (lowerKey === 'a') handleChoiceInput('✌️'); // a: 가위 (찌)
          if (lowerKey === 'w') handleChoiceInput('✊'); // w: 바위 (묵)
          if (lowerKey === 'd') handleChoiceInput('🖐️'); // d: 보 (빠)
        }
      }
    </script>
